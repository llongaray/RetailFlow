name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm test --workspace=@retailflow/api
      - run: npm run build --workspace=@retailflow/api
      - run: npm test --workspace=@retailflow/web
      - run: npm run build --workspace=@retailflow/web
      - run: npm run lint
